; /etc/supervisor/conf.d/portal.conf
; systemd 的等价方案，二选一。
; sudo supervisorctl reread && sudo supervisorctl update

[program:portal]
directory=/opt/dafors
command=/opt/dafors/.venv/bin/gunicorn --workers 2 --threads 4 --timeout 120 --bind 127.0.0.1:8000 --access-logfile - --error-logfile - portal.wsgi:application
user=portal
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=PORTAL_CONFIG="/opt/dafors/portal/config.json",PORTAL_TRUST_PROXY="1",PORTAL_HTTPS_ONLY="1",PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/portal.out.log
stderr_logfile=/var/log/portal.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
