# /etc/nginx/sites-available/portal.conf
# 替换：DOMAIN=portal.example.com，部署目录 /opt/dafors
# 证书申请（先放行 80 端口，再用 certbot 自动改写本文件）：
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d portal.example.com --agree-tos -m admin@example.com
#   sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # 只为 ACME 挑战保留明文路径，其余一律跳 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 上传包默认上限 200MB，留一点余量；应用侧还会再校验一次
    client_max_body_size 210m;
    client_body_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    access_log /var/log/nginx/portal.access.log;
    error_log  /var/log/nginx/portal.error.log warn;

    # 静态资源直出（portal/static 之外的文件永远不会被暴露）
    location /static/ {
        alias /opt/dafors/portal/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;          # 大 zip 下发不占内存
        proxy_request_buffering off;  # 上传流式校验
    }

    # 显式拒绝任何猜测存储目录的请求（文件本就不在 web 根下）
    location ~ ^/(storage|var|portal/var)/ {
        return 404;
    }
}
