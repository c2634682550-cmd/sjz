[project]
name = "sjz"
version = "0.1.0"
description = "SJZ 抢购控制台：模板匹配 + OCR + 定时抢购"
requires-python = ">=3.10"
dependencies = [
    "mss>=9.0,<11",
    "opencv-python>=4.8,<6",
    "numpy>=1.24,<3",
    # OCR 主路径：进程内 RapidOCR + ONNXRuntime（core/ocr_rapid.py）。
    # 模型（PP-OCRv6 small，30MB）随 core/assets/rapid 分发，离线可跑；
    # 缺模型时 RapidOCR 会退回它包内的同名模型。约 60MB 依赖，冷启动 1.2s。
    # PP-OCR 服务只做价格二次确认（core/ocr_ppocr.py 仍只用标准库 urllib），
    # 不给 exe 装 paddle（4.3GB）。旧的 winrt-* / tesseract 依赖已全部删除。
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20,<2",
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

# 只有 web/ 是静态资源，不是包；core/ 靠 sys.path 直接导入。
# 不建 build backend，这个项目不发布。
