[project]
name = "sjz"
version = "0.1.0"
description = "SJZ 抢购控制台：模板匹配 + OCR + 定时抢购"
requires-python = ">=3.10"
dependencies = [
    "mss>=9.0,<11",
    "opencv-python>=4.8,<6",
    "numpy>=1.24,<3",
    # OCR 不在这个环境里：core/ocr_ppocr.py 只用 urllib 连本机的 PaddleX
    # 服务（见 说明.txt 第九节）。原来那套 winrt-* 依赖随 Windows OCR 后端
    # 一起删了 —— 留着只会让 exe 多背几个用不到的 DLL。
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

# 只有 web/ 是静态资源，不是包；core/ 靠 sys.path 直接导入。
# 不建 build backend，这个项目不发布。
