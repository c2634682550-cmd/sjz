<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sjz direction · Tactical HUD</title><style>*{box-sizing:border-box;margin:0}html,body{height:100%}
.d3{--bg:#07090a;--p:#0e1214;--ln:#252c30;--ln2:#3a444a;--tx:#cfd6d4;--dim:#74807f;--ac:#ff6a1a;--ok:#7fb5a0;--bad:#ff4a3a;
background:var(--bg);color:var(--tx);height:900px;font:13px/1.5 "Bahnschrift","Microsoft YaHei",sans-serif;display:grid;grid-template-columns:76px 1fr;grid-template-rows:auto auto auto 1fr auto;overflow:hidden}
.d3 button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.d3 .top{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 20px;height:48px;border-bottom:1px solid var(--ln2)}
.d3 .brand{display:flex;gap:10px;align-items:center;font-weight:300;letter-spacing:.3em}.d3 .brand b{font-weight:300}
.d3 .logo{width:18px;height:18px;border:1px solid var(--ac);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--ac)}
.d3 .tabs{display:none}
.d3 .start{margin-left:auto;border:1px solid var(--ac);color:var(--ac);padding:8px 22px;letter-spacing:.3em;position:relative}.d3 .start:hover{background:var(--ac);color:#000}
.d3 kbd{margin-left:10px;font:11px monospace;opacity:.7}
.d3 .stat{grid-column:2;display:flex;gap:12px;align-items:center;padding:6px 20px;font:11px monospace;color:var(--dim);letter-spacing:.1em}.d3 .stat b{color:var(--tx);font-weight:400}.d3 .stat em{margin-left:auto;font-style:normal;color:var(--ok)}.d3 .dot{width:6px;height:6px;background:var(--ok);border-radius:50%}
.d3 .cards{grid-column:2;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 20px 12px}
.d3 .card{position:relative;padding:10px 14px;background:var(--p);border:1px solid var(--ln);display:flex;gap:10px;align-items:center}
.d3 .card::before,.d3 .card::after{content:"";position:absolute;width:8px;height:8px;border:1px solid var(--ln2)}.d3 .card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.d3 .card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.d3 .card small{display:block;font:10px monospace;letter-spacing:.2em;color:var(--dim)}.d3 .card b{display:block;font-weight:400}.d3 .card span{font-size:11px;color:var(--dim)}
.d3 .card.bad{border-color:#5a2a25}.d3 .card.bad b{color:var(--bad)}.d3 .card.ok b{color:var(--ok)}.d3 .ico{display:none}.d3 .mini{margin-left:auto;border:1px solid var(--ln2);padding:2px 8px;font-size:11px}
.d3 .main{grid-column:2;display:grid;grid-template-columns:1fr 320px;gap:12px;padding:0 20px 12px;min-height:0}
.d3 .list,.d3 .panel{background:var(--p);border:1px solid var(--ln);padding:14px;position:relative}
.d3 .lh{display:flex;gap:12px;align-items:baseline;margin-bottom:10px}.d3 .lh b{font-weight:300;letter-spacing:.24em}.d3 .lh span{color:var(--dim);font:11px monospace}.d3 .add{margin-left:auto;border:1px solid var(--ln2);padding:3px 12px}
.d3 table{width:100%;border-collapse:collapse}.d3 th{font:10px monospace;letter-spacing:.2em;color:var(--dim);text-align:left;padding:5px 6px;border-bottom:1px solid var(--ln2)}
.d3 td{padding:9px 6px;border-bottom:1px solid var(--ln);white-space:nowrap}.d3 td.nm{max-width:260px;overflow:hidden;text-overflow:ellipsis}.d3 tr.sel td{color:var(--ac);background:#150d08}.d3 td[data-s="运行中"]{color:var(--ok)}
.d3 .panel{display:flex;flex-direction:column;gap:10px}.d3 .ph b{font-weight:300;letter-spacing:.24em;display:block}.d3 .ph span{color:var(--dim);font-size:11px}
.d3 label{display:grid;gap:3px;font:10px monospace;letter-spacing:.2em;color:var(--dim)}.d3 select,.d3 input{background:var(--bg);border:1px solid var(--ln2);color:var(--tx);padding:6px 8px;font:13px "Bahnschrift",sans-serif}
.d3 .seg{display:flex;gap:4px}.d3 .seg button{flex:1;padding:5px;border:1px solid var(--ln2);color:var(--dim)}.d3 .seg .on{border-color:var(--ac);color:var(--ac)}.d3 .pr{display:flex;gap:6px;align-items:center}.d3 .pr input{flex:1;width:0;min-width:0}
.d3 .pf{margin-top:auto;display:flex;justify-content:space-between}.d3 .del{color:var(--bad);border:1px solid #5a2a25;padding:6px 12px}.d3 .save{border:1px solid var(--ac);color:var(--ac);padding:6px 16px}
.d3 .foot{grid-column:1/-1;display:flex;gap:22px;padding:6px 20px;border-top:1px solid var(--ln2);font:11px monospace;color:var(--dim)}
.d3 .rail{grid-column:1;grid-row:2/5;border-right:1px solid var(--ln2);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px}
.d3 .rail button{width:52px;padding:10px 0;font-size:11px;color:var(--dim);border-left:2px solid transparent;letter-spacing:.1em}.d3 .rail .on{color:var(--ac);border-color:var(--ac)}</style></head><body><div class="d3 app">
<header class="top"><div class="brand"><span class="logo" aria-hidden="true"></span><b>三角洲 · 抢购控制台</b></div>
<nav class="tabs"><button class="on">抢购</button><button>目标库</button><button>记录</button><button>分析</button><button>日记</button><button>设置</button></nav>
<button class="start">启动抢购<kbd>F7</kbd></button></header>
<nav class="rail"><button class="on">抢购</button><button>目标库</button><button>记录</button><button>分析</button><button>日记</button><button>设置</button></nav><div class="stat"><i class="dot"></i><b>待命，等你开始</b><span>共 1 条任务，1 条已启用</span><em>待命</em></div>
<section class="cards"><article class="card bad"><i class="ico"></i><div><small>游戏窗口</small><b>没找到游戏窗口</b><span>先在游戏里打开交易行，再回来点重新检查</span></div><button class="mini">重新检查</button></article><article class="card bad"><i class="ico"></i><div><small>画面识别</small><b>还没认出页面</b><span>还没有识别结果</span></div><button class="mini">重新检查</button></article><article class="card ok"><i class="ico"></i><div><small>时间校准</small><b>已自动校准</b><span>偏差 +28ms · 9 样本 · 3s 前</span></div></article><article class="card ok"><i class="ico"></i><div><small>购买延迟</small><b>0 毫秒</b><span>动态调整已开，点击更快更准</span></div></article></section>
<main class="main"><section class="list"><div class="lh"><b>任务清单</b><span>共 3 条任务</span><button class="add">+ 添加任务</button></div>
<table><thead><tr><th>#</th><th>目标</th><th>成色·磨损</th><th>价格区间</th><th>限量</th><th>已抢</th><th>状态</th></tr></thead><tbody><tr class="sel"><td>1</td><td class="nm">AKM突击步枪·星之彩</td><td>不限</td><td>≤ 41,500</td><td>1</td><td>0</td><td data-s="等待">等待</td></tr><tr><td>2</td><td class="nm">M4A1突击步枪·暗影</td><td>极品</td><td>≤ 68,000</td><td>2</td><td>1</td><td data-s="运行中">运行中</td></tr><tr><td>3</td><td class="nm">未命名任务·这是一个非常非常长的目标名称用来测试截断</td><td>不限</td><td>不限</td><td>1</td><td>0</td><td data-s="等待">等待</td></tr></tbody></table></section>
<aside class="panel"><div class="ph"><b>任务设置</b><span>AKM突击步枪·星之彩</span></div>
<label>赛季目标<select><option>不限赛季</option></select></label><label>成色选择<select><option>不限成色</option></select></label>
<label>品阶<span class="seg"><button class="on">不限</button><button>极品</button><button>优品</button></span></label>
<label>价格区间<span class="pr"><input placeholder="最低"><i>至</i><input placeholder="最高"></span></label>
<label>本轮限量<input value="1"></label>
<label>抢购路线<span class="seg"><button class="on">公示期倒计时</button><button>在售列表</button><button>商品页按钮</button></span></label>
<div class="pf"><button class="del">删除任务</button><button class="save">保存修改</button></div></aside></main>
<footer class="foot"><span>已连接</span><span>任务 1</span><span>队列 1</span><span>引擎待命</span><span>v1.1.2</span></footer></div></body></html>
