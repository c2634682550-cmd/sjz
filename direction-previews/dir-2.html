<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sjz direction · Ops Order</title><style>*{box-sizing:border-box;margin:0}html,body{height:100%}
.d2{--paper:#d9d0ae;--p2:#e8e1c6;--ink:#1c1a14;--dim:#4a4636;--stamp:#a3301c;--ok:#3d5a2a;--ln:#8b8467;
background:var(--paper);color:var(--ink);height:900px;font:13px/1.55 "SimSun","NSimSun","Courier New",monospace;overflow:hidden;padding:18px 28px;display:flex;flex-direction:column}
.d2 button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.d2 .top{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:end;border-bottom:3px double var(--ink);padding-bottom:10px}
.d2 .brand b{font-size:22px;letter-spacing:.3em}.d2 .brand::after{content:"OPERATION ORDER · 抢购令 No.001";display:block;font-size:11px;color:var(--dim);letter-spacing:.18em}
.d2 .logo{display:none}.d2 .tabs{display:flex;gap:18px;justify-content:center}.d2 .tabs button{padding:2px 0;border-bottom:2px solid transparent}.d2 .tabs .on{border-color:var(--stamp);color:var(--stamp);font-weight:700}
.d2 .start{border:3px solid var(--stamp);color:var(--stamp);padding:8px 20px;font-weight:700;letter-spacing:.3em;transform:rotate(-2deg)}.d2 kbd{margin-left:8px;font-size:11px}
.d2 .stat{display:flex;gap:14px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--ln)}.d2 .stat span{color:var(--dim)}.d2 .stat em{margin-left:auto;font-style:normal;border:2px solid var(--ink);padding:0 8px;letter-spacing:.2em}.d2 .dot{display:none}
.d2 .cards{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);margin:12px 0}.d2 .card{padding:8px 12px;border-right:1px solid var(--ink);display:flex;gap:8px;align-items:flex-start;position:relative}.d2 .card:last-child{border:0}
.d2 .card small{display:block;color:var(--dim);font-size:11px}.d2 .card b{display:block}.d2 .card span{font-size:11px;color:var(--dim)}
.d2 .card.bad b{color:var(--stamp)}.d2 .card.ok b{color:var(--ok)}.d2 .ico{display:none}.d2 .mini{margin-left:auto;border:1px solid var(--ink);padding:1px 8px;font-size:11px;white-space:nowrap}
.d2 .main{display:block;flex:1;min-height:0;overflow:hidden}
.d2 .lh{display:flex;gap:12px;align-items:baseline;margin-bottom:6px}.d2 .lh b{font-size:15px;letter-spacing:.2em}.d2 .lh span{color:var(--dim)}.d2 .add{margin-left:auto;border:1px solid var(--ink);padding:2px 10px}
.d2 table{width:100%;border-collapse:collapse;background:var(--p2)}.d2 th{text-align:left;padding:5px 8px;border:1px solid var(--ink);background:var(--paper);font-size:11px;letter-spacing:.2em}
.d2 td{padding:7px 8px;border:1px solid var(--ln);white-space:nowrap}.d2 td.nm{max-width:340px;overflow:hidden;text-overflow:ellipsis}.d2 tr.sel td{background:#f3edd3;font-weight:700}.d2 td[data-s="运行中"]{color:var(--ok);font-weight:700}
.d2 .panel{margin-top:14px;border:2px solid var(--ink);padding:12px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 24px;background:var(--p2)}
.d2 .ph{grid-column:1/-1;border-bottom:1px solid var(--ink);padding-bottom:4px}.d2 .ph b{letter-spacing:.3em}.d2 .ph span{margin-left:12px;color:var(--dim)}
.d2 label{display:grid;gap:3px;font-size:11px;color:var(--dim)}.d2 select,.d2 input{background:#f6f1db;border:1px solid var(--ink);padding:5px 8px;font:inherit;color:var(--ink)}
.d2 .seg{display:flex}.d2 .seg button{flex:1;padding:4px;border:1px solid var(--ink);margin-left:-1px}.d2 .seg .on{background:var(--ink);color:var(--paper)}.d2 .pr{display:flex;gap:6px;align-items:center}.d2 .pr input{flex:1;min-width:0}
.d2 .pf{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px dashed var(--ln);padding-top:8px}.d2 .del{border:1px solid var(--stamp);color:var(--stamp);padding:4px 14px}.d2 .save{background:var(--ink);color:var(--paper);padding:4px 20px;letter-spacing:.2em}
.d2 .foot{margin-top:auto;display:flex;gap:24px;border-top:3px double var(--ink);padding-top:6px;color:var(--dim);font-size:11px}</style></head><body><div class="d2 app">
<header class="top"><div class="brand"><span class="logo" aria-hidden="true"></span><b>三角洲 · 抢购控制台</b></div>
<nav class="tabs"><button class="on">抢购</button><button>目标库</button><button>记录</button><button>分析</button><button>日记</button><button>设置</button></nav>
<button class="start">启动抢购<kbd>F7</kbd></button></header>
<div class="stat"><i class="dot"></i><b>待命，等你开始</b><span>共 1 条任务，1 条已启用</span><em>待命</em></div>
<section class="cards"><article class="card bad"><i class="ico"></i><div><small>游戏窗口</small><b>没找到游戏窗口</b><span>先在游戏里打开交易行，再回来点重新检查</span></div><button class="mini">重新检查</button></article><article class="card bad"><i class="ico"></i><div><small>画面识别</small><b>还没认出页面</b><span>还没有识别结果</span></div><button class="mini">重新检查</button></article><article class="card ok"><i class="ico"></i><div><small>时间校准</small><b>已自动校准</b><span>偏差 +28ms · 9 样本 · 3s 前</span></div></article><article class="card ok"><i class="ico"></i><div><small>购买延迟</small><b>0 毫秒</b><span>动态调整已开，点击更快更准</span></div></article></section>
<main class="main"><section class="list"><div class="lh"><b>任务清单</b><span>共 3 条任务</span><button class="add">+ 添加任务</button></div>
<table><thead><tr><th>#</th><th>目标</th><th>成色·磨损</th><th>价格区间</th><th>限量</th><th>已抢</th><th>状态</th></tr></thead><tbody><tr class="sel"><td>1</td><td class="nm">AKM突击步枪·星之彩</td><td>不限</td><td>≤ 41,500</td><td>1</td><td>0</td><td data-s="等待">等待</td></tr><tr><td>2</td><td class="nm">M4A1突击步枪·暗影</td><td>极品</td><td>≤ 68,000</td><td>2</td><td>1</td><td data-s="运行中">运行中</td></tr><tr><td>3</td><td class="nm">未命名任务·这是一个非常非常长的目标名称用来测试截断</td><td>不限</td><td>不限</td><td>1</td><td>0</td><td data-s="等待">等待</td></tr></tbody></table></section>
<aside class="panel"><div class="ph"><b>任务设置</b><span>AKM突击步枪·星之彩</span></div>
<label>赛季目标<select><option>不限赛季</option></select></label><label>成色选择<select><option>不限成色</option></select></label>
<label>品阶<span class="seg"><button class="on">不限</button><button>极品</button><button>优品</button></span></label>
<label>价格区间<span class="pr"><input placeholder="最低"><i>至</i><input placeholder="最高"></span></label>
<label>本轮限量<input value="1"></label>
<label>抢购路线<span class="seg"><button class="on">公示期倒计时</button><button>在售列表</button><button>商品页按钮</button></span></label>
<div class="pf"><button class="del">删除任务</button><button class="save">保存修改</button></div></aside></main>
<footer class="foot"><span>已连接</span><span>任务 1</span><span>队列 1</span><span>引擎待命</span><span>v1.1.2</span></footer></div></body></html>
